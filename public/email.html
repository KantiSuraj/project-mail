<html lang="en">
<head>
    <title>Email</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="email-body">
    <header class="header">
        <h1><span class="r">RTC</span>MAIL</h1>
        <h2 class="m"></h2>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button class="btn compose-btn" onclick="showCompose()">Compose</button>
            <div class="menu">
                <button class="menu-item" onclick="showInbox()">Inbox</button>
                <button class="menu-item" onclick="showSent()">Sent</button>
                <button class="menu-item" onclick="showPromotion()">Promotions</button>
            </div>
        </aside>
        <main class="main-content">
            <div id="composeSection" class="section" style="display: none;">
                <h2>Compose Email</h2>
                <form id="emailForm">
                    <input type="email" id="to" placeholder="To:" required>
                    <input type="text" id="subject" placeholder="Subject:">
                    <textarea id="message" placeholder="Write your message here..." required></textarea>
                    <button type="submit" class="snd">Send</button>
                </form>
            </div>

            <div id="inboxSection" class="section">
                <h2>Inbox</h2>
                <ul id="inboxList"></ul>
            </div>

            <div id="sentSection" class="section" style="display: none;">
                <h2>Sent Emails</h2>
                <ul id="sentList"></ul>
            </div>
            <div id="promotionSection" class="section" style="display: none;">
                <h2>Promotional Emails</h2>
                <ul id="promotionList"></ul>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
